# Kubernetes deployment config — self-contained, no external services needed.
#
# Runs everything in a single pod:
#   - Queen server         (web UI, API, scheduler)
#   - Embedded Ant worker  (SHELL, DOCKER, KUBERNETES, HTTP executors)
#   - Embedded SeaweedFS   (artifact storage)
#   - SQLite               (database)
#
# The pod uses its ServiceAccount token for in-cluster Kubernetes access —
# no kubeconfig mount needed.
#
# Auth secrets are injected via Kubernetes Secret (see k8s.yaml).
common:
    public_dir: /app/public/
    http_port: 7777
    rate_limit_sec: 100
    s3:
        local_mode: true
        local_data_dir: /data/seaweedfs
        local_weed_bin: /usr/local/bin/weed
        local_s3_port: 19000
        bucket: formicary-artifacts
        public_endpoint: localhost:19000
    auth:
        enabled: true
db:
    data_source: /data/formicary.db
    type: sqlite
embedded_ant:
    tags: ["docker", "kubernetes", "shell", "builder"]
    methods:
      - KUBERNETES
      - SHELL
      - HTTP_GET
      - HTTP_POST_FORM
      - HTTP_POST_JSON
      - HTTP_PUT_FORM
      - HTTP_PUT_JSON
      - HTTP_DELETE
    max_capacity: 10
    kubernetes:
      namespace: "default"
      allow_privilege_escalation: true
      registry:
        pull_policy: always
      host_aliases:
        - ip: "100.107.120.55"
          hostnames:
            - "ai"
      default_resources:
        cpuRequest: "500m"
        memoryRequest: "512Mi"
        cpuLimit: "1"
        memoryLimit: "1Gi"
