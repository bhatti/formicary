# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Read-only AI gate-review: analyse a PR and report risk/findings — no PR changes.
#
# Pipeline: review → gate-check → done
#
# 1. review:     Clone PR, run AI code review (ygs-code-review skill), compute risk score,
#                generate HTML/MD report with findings, risk score, blast radius, gate decision.
# 2. gate-check: Compute gate_result.json (needs_approval, risk_tier, critical findings).
#                Read-only — writes no comments, makes no merge decisions.
#
# The report tells the human: "safe to merge" or "needs approval — here's why."
# All actual PR approval/merge actions stay in the normal GitHub/Bitbucket review process.
#
# Deploy:
#   ./deploy-ai-workflows.sh --create-k8s-secret --set-configs

job_type: ai-gate-review
description: "Read-only AI review: risk score, blast radius, findings — no PR changes"
max_concurrency: 10
timeout: 3600s

variables:
  PRNumber:
    type: STRING
    required: true

tasks:
# --- REVIEW ------------------------------------------------------------------
# Clones the PR, runs AI review, computes risk score, generates full report.
- task_type: review
  method: KUBERNETES
  timeout: 15m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 4G
    memory_request: 1G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    PR_NUMBER: "{{.PRNumber}}"
    BASE_BRANCH: "{{.BaseBranch}}"
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    DEFAULT_TRACKER: "{{.DefaultTracker}}"
    BITBUCKET_WORKSPACE: "{{.BitbucketWorkspace}}"
    BITBUCKET_REPO: "{{.BitbucketRepo}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
    CODEBASE_DIR: /workspace/repo
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_ID: "{{.JobID}}"
    TASK_TYPE: "review"
    REPORT_TITLE: "PR Review Report"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - python -m scripts.mq.clone_pr --pr-number {{.PRNumber}}
    - python -m scripts.mq.scope_router --pr-number {{.PRNumber}} || true
    - python -m scripts.review.run --pr-url {{.PRNumber}} --base-branch {{.BaseBranch}}
    - python -m scripts.mq.risk_score --pr-number {{.PRNumber}}
    - python -m scripts.mq.report
  artifacts:
    paths:
      - ./review_result.json
      - ./risk_score.json
      - ./logs
      - ./reports
    expire_after: 24h
  on_completed: gate-check
  on_failed: notify-error

# --- GATE-CHECK --------------------------------------------------------------
# Computes gate_result.json and emits context keys — read-only, no PR changes.
- task_type: gate-check
  method: KUBERNETES
  timeout: 3m
  report_stdout: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "200m"
    memory_limit: 1G
    memory_request: 256Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - review
  environment:
    WORKSPACE_DIR: /workspace
    APPROVAL_THRESHOLD: "{{.ApprovalThreshold}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - |
      python3 -c "
      import json, os, sys
      risk = json.load(open('/workspace/risk_score.json'))
      review = json.load(open('/workspace/review_result.json'))
      threshold = int(os.environ.get('APPROVAL_THRESHOLD', '70'))
      score = risk['score']
      has_critical = any(f.get('severity') == 'critical' for f in review.get('findings', []))
      needs_approval = score >= threshold or has_critical
      gate = {
          'risk_score': score,
          'risk_tier': risk['tier'],
          'has_critical_findings': has_critical,
          'findings_count': len(review.get('findings', [])),
          'needs_approval': needs_approval,
          'reason': 'critical findings' if has_critical else f'risk score {score} >= {threshold}' if needs_approval else f'risk score {score} < {threshold}'
      }
      json.dump(gate, open('/workspace/gate_result.json', 'w'), indent=2)
      label = 'needs-approval' if needs_approval else 'safe-to-merge'
      print(f'Gate: {label} — {gate[\"reason\"]}')
      print(f'::add-task-context GATE_LABEL::{label}')
      print(f'::add-task-context GATE_REASON::{gate[\"reason\"]}')
      "
  artifacts:
    paths:
      - ./gate_result.json
    expire_after: 24h
  on_completed: done
  on_failed: notify-error

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    JOB_TYPE: "ai-gate-review"
    MESSAGE: ":x: Gate-review failed for PR {{.PRNumber}}."
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "Gate-review complete — check report in artifacts"

job_variables:
  BaseBranch: "main"
  ApprovalThreshold: "70"
  AiDevToolsDebug: ""
  FormicaryPublicURL: ""
  SlackChannel: ""
  SlackThreadTs: ""
  DefaultTracker: ""
  BitbucketWorkspace: ""
  BitbucketRepo: ""
  GitHubOrg: ""
  GitHubRepo: ""
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  AnthropicSonnetModel: "us.anthropic.claude-sonnet-4-6"
  AnthropicOpusModel: "us.anthropic.claude-opus-4-6-v1"
  AnthropicHaikuModel: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
