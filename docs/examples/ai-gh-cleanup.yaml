# Periodic maintenance: removes merged/closed AI branches from GitHub.
# Runs every 4 hours via cron as a Kubernetes pod.
#
# cleanup task runs inside the ai-dev-tools image:
#   - Deletes remote ai/* branches whose PRs are merged or closed
#
# Credentials are injected from the 'ai-dev-credentials' Kubernetes secret.
#
# Deploy (with Formicary running in Kubernetes via k8s.yaml):
#   ./deploy-ai-workflows.sh --create-k8s-secret --set-configs \
#     --gh-org YOUR_ORG --gh-repo YOUR_REPO

job_type: ai-gh-cleanup
description: "Periodic maintenance: clean stale workspaces and merged AI branches"
cron_trigger: "0 0 */4 * * * *"
max_concurrency: 1
timeout: 10m

tasks:
- task_type: cleanup
  method: KUBERNETES
  timeout: 8m
  report_stdout: true
  host_network: true
  container:
    image: plexobject/ai-dev-tools:latest
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
  script:
    - python -m scripts.gh.cleanup
  artifacts:
    paths:
      - ./cleanup_report.txt
    when: always

job_variables:
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  # Injected via org configs (set via deploy-ai-workflows.sh --set-configs):
  #   GitHubOrg, GitHubRepo  (plain)
  # Injected from the 'ai-dev-credentials' K8s secret:
  #   GH_TOKEN, ANTHROPIC_API_KEY (optional)
