# AI-driven GitHub SDLC pipeline: plan → implement → create-pr → poll-pr
#
# All tasks run as Kubernetes pods using the ai-dev-tools image.
# Each task gets a fresh emptyDir at /workspace; artifacts pass data between tasks.
# host_network: true enables Tailscale VPN access to the Bedrock proxy.
#
# Credentials are injected from the 'ai-dev-credentials' Kubernetes secret
# (created once by deploy-ai-workflows.sh --create-k8s-secret).
# Non-secret config is set via org configs (deploy-ai-workflows.sh --set-configs).
#
# Deploy (with Formicary running in Kubernetes via k8s.yaml):
#   ./deploy-ai-workflows.sh --create-k8s-secret --set-configs \
#     --gh-org YOUR_ORG --gh-repo YOUR_REPO

job_type: ai-gh-implement
description: "AI agent: plan → implement → create-pr → poll-pr for a GitHub issue"
max_concurrency: 5
timeout: 86400s

variables:
  IssueNumber:
    type: STRING
    required: true

tasks:
# --- PLAN --------------------------------------------------------------------
- task_type: plan
  method: KUBERNETES
  timeout: 15m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 4G
    memory_request: 1G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    MAX_TURNS_PLAN: "{{.MaxTurnsPlan}}"
    GIT_USER_NAME: "{{.GitUserName}}"
    GIT_USER_EMAIL: "{{.GitUserEmail}}"
    BASE_BRANCH: "{{.GitBranch}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
    CODEBASE_DIR: /workspace/repo
  script:
    - python -m scripts.gh.issue_picker --issue-id {{.IssueNumber}}
    - python -m scripts.gh.plan --issue-id {{.IssueNumber}}
  artifacts:
    paths:
      - ./issue.json
      - ./plan.md
      - ./plan_result.json
      - ./logs
    expire_after: 24h
  on_exit_code:
    2: PAUSE_JOB    # BLOCKED — needs human intervention
  on_completed: implement
  on_failed: notify-error

# --- IMPLEMENT ---------------------------------------------------------------
- task_type: implement
  method: KUBERNETES
  timeout: 90m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 4G
    memory_request: 2G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - plan
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    MAX_TURNS_IMPLEMENT: "{{.MaxTurnsImplement}}"
    GIT_USER_NAME: "{{.GitUserName}}"
    GIT_USER_EMAIL: "{{.GitUserEmail}}"
    BASE_BRANCH: "{{.GitBranch}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
    ANTHROPIC_COMPLEXITY_LOW_MODEL:  "{{.AnthropicComplexityLowModel}}"
    ANTHROPIC_COMPLEXITY_HIGH_MODEL: "{{.AnthropicComplexityHighModel}}"
    CODEBASE_DIR: /workspace/repo
  script:
    - python -m scripts.gh.clone_repo --issue-id {{.IssueNumber}}
    - |
      COMPLEXITY=$(cat /workspace/plan_complexity.txt 2>/dev/null || echo "medium")
      if [ "$COMPLEXITY" = "high" ] && [ -n "$ANTHROPIC_COMPLEXITY_HIGH_MODEL" ] && [ "$ANTHROPIC_COMPLEXITY_HIGH_MODEL" != "<no value>" ]; then
        export AI_MODEL="$ANTHROPIC_COMPLEXITY_HIGH_MODEL"
        export ANTHROPIC_DEFAULT_SONNET_MODEL="$ANTHROPIC_COMPLEXITY_HIGH_MODEL"
      elif [ "$COMPLEXITY" = "low" ] && [ -n "$ANTHROPIC_COMPLEXITY_LOW_MODEL" ] && [ "$ANTHROPIC_COMPLEXITY_LOW_MODEL" != "<no value>" ]; then
        export AI_MODEL="$ANTHROPIC_COMPLEXITY_LOW_MODEL"
        export ANTHROPIC_DEFAULT_SONNET_MODEL="$ANTHROPIC_COMPLEXITY_LOW_MODEL"
      fi
      echo "[implement] complexity=$COMPLEXITY AI_MODEL=$AI_MODEL"
    - python -m scripts.gh.run_implement --issue-id {{.IssueNumber}}
    - python -m scripts.gh.push_impl --issue-id {{.IssueNumber}}
  artifacts:
    paths:
      - ./impl_result.json
      - ./impl_run_result.json
      - ./impl_report.md
      - ./impl_report.html
      - ./clone_result.json
      - ./branch.txt
      - ./logs
    expire_after: 24h
  on_exit_code:
    2: PAUSE_JOB    # BLOCKED / MAX_TURNS_REACHED — needs human review
  on_completed: self-review
  on_failed: notify-error

# --- SELF-REVIEW -------------------------------------------------------------
- task_type: self-review
  method: KUBERNETES
  timeout: 15m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 2G
    memory_request: 512Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - implement
  environment:
    WORKSPACE_DIR: /workspace
    BASE_BRANCH: "{{.GitBranch}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
    CODEBASE_DIR: /workspace/repo
  script:
    - python -m scripts.review.run --mode self-review --issue-id {{.IssueNumber}} --base-branch {{.GitBranch}}
  artifacts:
    paths:
      - ./self_review.json
    expire_after: 24h
  on_exit_code:
    2: PAUSE_JOB    # BLOCKED — critical findings require human review before PR
  on_completed: create-pr
  on_failed: notify-error

# --- CREATE-PR ---------------------------------------------------------------
- task_type: create-pr
  method: KUBERNETES
  timeout: 15m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "200m"
    memory_limit: 2Gi
    memory_request: 512Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - plan
    - implement
    - self-review
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    INPROGRESS_LABEL: "{{.InProgressLabel}}"
    PR_OPEN_LABEL: "{{.PrOpenLabel}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
    CODEBASE_DIR: /workspace/repo
  script:
    - python -m scripts.gh.build_pr --issue-id {{.IssueNumber}}
    - python -m scripts.gh.notify_pr --issue-id {{.IssueNumber}}
  artifacts:
    paths:
      - ./pr.json
      - ./notify_result.json
    expire_after: 24h
  on_completed: poll-pr
  on_failed: notify-error

# --- POLL-PR -----------------------------------------------------------------
# poll_pr.py runs once: exits 0 (merged/closed), 3 (still open → PAUSED), 1 (error).
# learn.py is called automatically inside poll_pr on exit 0.
# delay: controls how long formicary waits before re-running this task after PAUSED.
- task_type: poll-pr
  method: KUBERNETES
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - create-pr
    - poll-pr
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    NEEDS_HUMAN_LABEL: "{{.NeedsHumanLabel}}"
    MAX_TURNS_FEEDBACK: "{{.MaxTurnsFeedback}}"
    GIT_USER_NAME: "{{.GitUserName}}"
    GIT_USER_EMAIL: "{{.GitUserEmail}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
    CODEBASE_DIR: /workspace/repo
  script:
    - python -m scripts.gh.check_pr_state --issue-id {{.IssueNumber}}
    - python -m scripts.gh.fetch_comments --issue-id {{.IssueNumber}}
    - python -m scripts.gh.respond_comments --issue-id {{.IssueNumber}}
  artifacts:
    paths:
      - ./pr.json
      - ./monitor_result.json
      - ./processed_comments.json
      - ./pending_comments.json
      - ./poll_state.json
    expire_after: 168h    # 7 days
  on_exit_code:
    3: PAUSE_JOB    # PR still open — formicary waits delay then retries
  on_completed: done
  on_failed: notify-error
  delay: "{{.PollInterval}}s"

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  context_variables:
    - name: ISSUE_NUMBER
      value: "{{.IssueNumber}}"
    - name: SELECTED_TRACKER
      value: github
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
  environment:
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    JOB_TYPE: "ai-gh-implement"
    MESSAGE: ":x: Job failed."
  script:
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
# Terminal leaf task — poll-pr routes here on success (exit 0).
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "Pipeline complete"

job_variables:
  MaxTurnsPlan: "50"
  MaxTurnsImplement: "200"
  MaxTurnsFeedback: "20"
  MaxClaudeProcessTimeout: ""
  ExtraSkillsRepos: ""
  PollInterval: "120"
  GitUserName: "AI Agent"
  GitUserEmail: "ai-agent@noreply.local"
  GitBranch: "main"
  InProgressLabel: "ai-in-progress"
  PrOpenLabel: "ai-pr-open"
  NeedsHumanLabel: "needs-human"
  SlackChannel: ""
  SlackThreadTs: ""
  FormicaryPublicURL: ""
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  AnthropicSonnetModel: "us.anthropic.claude-sonnet-4-6"
  AnthropicOpusModel: "us.anthropic.claude-opus-4-6-v1"
  AnthropicHaikuModel: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Complexity-tiered model selection (set via deploy-ai-workflows.sh --set-configs):
  AnthropicComplexityLowModel: ""   # empty = use Haiku default from org config
  AnthropicComplexityHighModel: ""  # empty = use Opus default from org config
  # Injected via org configs (set via deploy-ai-workflows.sh --set-configs):
  #   GitHubOrg, GitHubRepo    (plain)
  #   SlackChannel             (plain, optional — Slack notifications)
  #   AnthropicComplexityLowModel, AnthropicComplexityHighModel (from models.env)
  # Injected from the 'ai-dev-credentials' K8s secret:
  #   GH_TOKEN, SSH_PRIVATE_KEY, ANTHROPIC_API_KEY (optional)
  #   SLACK_BOT_TOKEN          (optional — enables Slack notifications)
