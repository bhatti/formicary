# AI PR audit: analyze the last N pull requests of a git repo for spec/design/skills
# gaps, then create a skill-improvement PR with fixes.
#
# Uses scripts.analyze.run_pr_audit and scripts.analyze.post_pr_audit for analysis,
# then scripts.analyze.create_skill_pr to open a PR with improvements.
#
# Triggered via Slack: "@bot pr-audit" | "@bot pr-audit <repo-url>" | "@bot pr-audit <pr-url> [<pr-url2>...]" | "@bot pr-audit ... --model <alias|id>"
#   Team filtering is OFF unless --team is given (org-config defaults JiraSpace/JiraBoards/PrAuditTeamMembers are ignored by the audit):
#   "@bot pr-audit --team"                    your default Jira team (looked up from your Slack e-mail)
#   "@bot pr-audit --team alice,bob"         filter to PRs by those GitHub logins (comma = member list)
#   "@bot pr-audit --team MyTeam"            filter by GH label matching team name (single word = label filter)
#   "@bot pr-audit --board <id>"             filter to PRs referencing issues on this Jira board (requires Jira creds)
#   "@bot pr-audit --board"                  use JIRA_BOARDS org config as default board
#   "@bot pr-audit --milestone v2.5"         filter to PRs in that GitHub milestone
#   "@bot pr-audit --filter label=security"  filter by GitHub label
#   "@bot pr-audit --filter field=value"     filter by Jira field=value (requires Jira creds)
#
#   "@bot pr-audit --n-prs 40"                max PRs to analyze (default NPrs = 50)
#   "@bot pr-audit --reviewers alice,bob"     learn what these reviewers look for: only PRs they reviewed, all their comments in
#                                             full; writes review_learnings.md + a review-knowledge skill (checklists by category)
#   "@bot pr-audit --breaking-diffs 40"       how many of the riskiest PRs get their diff read for the Changelog & Blast Radius section (default 60; 0 = paths only)
#   "@bot pr-audit --no-changelog"            skip the Changelog & Blast Radius section
#   "@bot pr-audit --dry-run"                 produce every report and the would-be files (reports/dry_run/) but create no PR
#
# Deploy:
#   ./deploy-ai-workflows.sh --create-k8s-secret --set-configs
#
# Org-config keys (set via deploy-ai-workflows.sh --set-configs):
#   BitbucketRepoBranch   default branch for Bitbucket repos (default: main)
#   GitHubRepoBranch      default branch for GitHub repos (default: main)
#   NPrs                  PRs to analyze (default: 50)
#   PrAuditFocus          focus dimension: all|spec|design|skills|testing|process
#   MaxPrAuditSize        max bytes of code to analyze (default: 10485760 = 10MB)

job_type: ai-gh-pr-audit
description: "AI PR audit: analyze last N PRs for spec/design/skills gaps, create skill-improvement PR"
max_concurrency: 5
timeout: 86400s

variables:
  RepoUrl:
    type: STRING
    required: false
  PrUrls:
    type: STRING
    required: false

tasks:
# --- AUDIT-PRS ---------------------------------------------------------------
- task_type: audit-prs
  method: KUBERNETES
  # Gap audit, then the review-learnings blocks and the changelog as separate model runs (each bounded by MaxClaudeProcessTimeout)
  timeout: 150m
  task_variables:
    SELECTED_TRACKER: "github"
    SLACK_CHANNEL: "{{.SlackChannel}}"
  context_variables:
    - name: SELECTED_TRACKER
      value: "github"
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 8G
    memory_request: 2G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    AI_MODEL_OVERRIDE: "{{.AiModel}}"
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    DEFAULT_TRACKER: "github"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    GH_REPO_BRANCH: "{{.GitHubRepoBranch}}"
    N_PRS: "{{.NPrs}}"
    PR_AUDIT_FOCUS: "{{.PrAuditFocus}}"
    MAX_TURNS_AUDIT: "{{.MaxTurnsAudit}}"
    # The review learnings and the changelog are their own model runs (the gap audit has no room for 500 PRs of comments and facts)
    MAX_TURNS_LEARNINGS: "{{.MaxTurnsLearnings}}"
    MAX_TURNS_CHANGELOG: "{{.MaxTurnsChangelog}}"
    MAX_PR_AUDIT_SIZE: "{{.MaxPrAuditSize}}"
    MAX_CLAUDE_PROCESS_TIMEOUT: "{{.MaxClaudeProcessTimeout}}"
    MAX_DEEP_REVIEWS: "{{.MaxDeepReviews}}"
    JIRA_BOARDS: "{{.JiraBoards}}"
    JIRA_SPACE: "{{.JiraSpace}}"
    PR_AUDIT_TEAM_MEMBERS: "{{.PrAuditTeamMembers}}"
    PR_AUDIT_GH_MILESTONE: "{{.PrAuditGhMilestone}}"
    PR_AUDIT_FILTER: "{{.PrAuditFilter}}"
    PR_AUDIT_REVIEWERS: "{{.PrAuditReviewers}}"
    PR_AUDIT_DRY_RUN: "{{.PrAuditDryRun}}"
    PR_AUDIT_CONTEXT_CHARS: "{{.PrAuditContextChars}}"
    PR_AUDIT_CHANGELOG: "{{.PrAuditChangelog}}"
    # The Slack user (e-mail): a bare "--team" means that person's default Jira team
    SLACK_USER_TAG: "{{.UserTag}}"
    PR_AUDIT_DIFF_PRS: "{{.PrAuditDiffPrs}}"
    # The route passes the text after "pr-audit" through unmodified (pass_through_args); run_pr_audit parses the repo URL,
    # PR URLs, board URL and every flag from it (one parser). yamlq makes it safe inside this YAML string.
    SLACK_MESSAGE: "{{.RepoUrl | yamlq}}"
    PR_URLS: "{{.PrUrls | yamlq}}"
    AUDIT_FULL_REPORT: "{{.AuditFullReport}}"
    EXTRA_SKILLS_REPOS: "{{.ExtraSkillsRepos}}"
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_ID: "{{.JobID}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - |
      mkdir -p ./logs ./reports
      # Output goes directly to stdout so Formicary captures ::add-task-context markers in real time.
      python -m scripts.analyze.run_pr_audit \
        --n-prs "{{.NPrs}}" \
        --focus "{{.PrAuditFocus}}"
      RC=$?
      # Post report to Slack in the same pod (files are in ./reports/)
      if [ $RC -eq 0 ]; then
        echo "[pr-audit-post] running post_pr_audit ..."
        ls -la ./reports/ 2>&1 || echo "[pr-audit-post] reports dir missing"
        python -m scripts.analyze.post_pr_audit 2>&1
        POST_RC=$?
        echo "[pr-audit-post] post_pr_audit exit=$POST_RC"
      fi
      exit $RC
  artifacts:
    paths:
      - ./reports
      - ./reports/pr_data_raw.json
      - ./reports/pr_reviews_raw.json
      - ./reports/issues_raw.json
      - ./logs
    expire_after: 72h
  on_completed: plan-skill-updates
  on_failed: notify-error

# --- PLAN-SKILL-UPDATES ------------------------------------------------------
# Focused Claude session: reads audit findings + skill_improvements.json, reviews
# current skill files in the repo, and writes a detailed skill_update_plan.md.
# Mirrors the plan task in the implement workflow (same claude_runner pattern).
- task_type: plan-skill-updates
  method: KUBERNETES
  timeout: 20m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 4G
    memory_request: 1G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - audit-prs
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    MAX_TURNS_PLAN: "{{.MaxTurnsPlan}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_ID: "{{.JobID}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - |
      # If AiDevToolsDebug=1, clone latest scripts to /app/scripts/ before module discovery.
      # Required for new modules not yet in the image. Noop when debug mode is off.
      python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
      python -m scripts.analyze.plan_skill_updates
  artifacts:
    paths:
      - ./reports/skill_update_plan.md
      - ./reports/skill_update_plan.html
      - ./reports/skill_update_plan_result.json
      - ./reports/skill_improvements_refined.json
      - ./reports/review_learnings_refined.json
      - ./logs
    expire_after: 72h
  on_completed: create-skill-pr
  on_failed: notify-error

# --- CREATE-SKILL-PR --------------------------------------------------------
- task_type: create-skill-pr
  method: KUBERNETES
  timeout: 30m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 4G
    memory_request: 1G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - audit-prs
    - plan-skill-updates
  environment:
    WORKSPACE_DIR: /workspace
    PR_AUDIT_DRY_RUN: "{{.PrAuditDryRun}}"
    PR_AUDIT_REVIEWERS: "{{.PrAuditReviewers}}"
    GIT_USER_NAME: "{{.GitUserName}}"
    GIT_USER_EMAIL: "{{.GitUserEmail}}"
    DEFAULT_TRACKER: "github"
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    CODEBASE_DIR: /workspace/repo
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    GH_REPO_BRANCH: "{{.GitHubRepoBranch}}"
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_ID: "{{.JobID}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -m scripts.analyze.create_skill_pr
  artifacts:
    paths:
      - ./pr.json
      - ./reports/dry_run
      - ./reports/skill_updates_report.md
      - ./reports/skill_updates_report.html
      - ./logs
    expire_after: 72h
  on_completed: poll-pr
  on_failed: done

# --- POLL-PR -----------------------------------------------------------------
# poll_pr.py runs once: exits 0 (merged/closed), 3 (still open -> PAUSED), 1 (error).
# learn.py is called automatically inside poll_pr on exit 0.
# delay: controls how long formicary waits before re-running this task after PAUSED.
- task_type: poll-pr
  method: KUBERNETES
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - create-skill-pr
    - poll-pr
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    NEEDS_HUMAN_LABEL: "{{.NeedsHumanLabel}}"
    MAX_TURNS_FEEDBACK: "{{.MaxTurnsFeedback}}"
    MAX_TURNS_LEARN: "{{.MaxTurnsLearn}}"
    GIT_USER_NAME: "{{.GitUserName}}"
    GIT_USER_EMAIL: "{{.GitUserEmail}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    CODEBASE_DIR: /workspace/repo
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - |
      set -eu
      # pr.json is at /workspace/pr.json (artifacts module uses workspace root directly).
      if [ ! -f ./pr.json ]; then
        echo "[poll-pr] pr.json not found — no PR created, skipping"
        exit 0
      fi
      PR_NUM=$(python3 -c "import json; d=json.load(open('./pr.json')); print(d.get('number',0))" 2>/dev/null || echo 0)
      if [ "$PR_NUM" = "0" ] || [ -z "$PR_NUM" ]; then
        echo "[poll-pr] No PR to poll (number=0) — skipping"
        exit 0
      fi
      python -m scripts.gh.check_pr_state --issue-id pr-audit
      python -m scripts.gh.fetch_comments --issue-id pr-audit
      python -m scripts.gh.respond_comments --issue-id pr-audit
  artifacts:
    paths:
      - ./pr.json
      - ./poll_state.json
      - ./processed_comments.json
      - ./pending_comments.json
    expire_after: 168h    # 7 days
  on_exit_code:
    3: PAUSE_JOB    # PR still open — formicary waits delay then retries
  on_completed: done
  on_failed: notify-error
  delay: "{{.PollInterval}}s"

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  context_variables:
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
  environment:
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    SKILL_NAME: "ygs-pr-audit"
    MESSAGE: ":x: *PR Audit* failed. Check <{{.FormicaryPublicURL}}/dashboard/jobs/requests/{{.JobID}}|job logs> for details."
  script:
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "PR audit complete"

job_variables:
  RepoUrl: ""
  # Slack --model <alias|id> (queen maps the flag to this parameter); empty = scripts/common/models.json default
  AiModel: ""
  PrUrls: ""
  # Branch defaults — overridden at runtime by org configs BitbucketRepoBranch / GitHubRepoBranch.
  # Formicary variable resolution: job params > org configs > job_variables (defaults).
  BitbucketRepoBranch: "main"
  GitHubRepoBranch: "main"
  NPrs: "50"
  PrAuditFocus: "all"
  # Team/sprint filtering (optional — leave empty to analyze all PRs)
  # JiraBoards:         board ID(s) — filters PRs referencing board issues     (@bot pr-audit --board <id>)
  # JiraSpace:          team name — maps to GH label (GitHub) or Jira team     (@bot pr-audit --team <name>)
  # PrAuditTeamMembers: comma-separated GitHub logins — author/reviewer filter (@bot pr-audit --team alice,bob)
  # PrAuditGhMilestone: GitHub milestone name                                   (@bot pr-audit --milestone v2.5)
  # PrAuditFilter:      label=X (GitHub) or field=value (Jira JQL)              (@bot pr-audit --filter f=v)
  JiraBoards: ""
  JiraSpace: ""
  PrAuditTeamMembers: ""
  PrAuditGhMilestone: ""
  PrAuditFilter: ""
  # Review learnings / dry run (Slack: --reviewers a,b  --dry-run  — the queen maps them to these variables)
  PrAuditReviewers: ""
  PrAuditDryRun: ""
  PrAuditContextChars: ""
  # Changelog & Blast Radius: PrAuditChangelog "0" turns it off (Slack: --no-changelog); PrAuditDiffPrs = risky PRs whose diff is read (Slack: --breaking-diffs N)
  PrAuditChangelog: ""
  UserTag: ""
  PrAuditDiffPrs: ""
  AuditFullReport: ""
  MaxTurnsAudit: "120"
  MaxTurnsLearnings: "10"
  MaxTurnsChangelog: "15"
  MaxTurnsPlan: "30"
  MaxPrAuditSize: "10485760"
  MaxTurnsFeedback: "20"
  MaxTurnsLearn: "15"
  PollInterval: "120"
  GitUserName: "AI Agent"
  GitUserEmail: "ai-agent@noreply.local"
  SlackChannel: ""
  SlackThreadTs: ""
  DefaultTracker: ""
  MaxClaudeProcessTimeout: "3300"
  MaxDeepReviews: "2"
  ExtraSkillsRepos: ""
  FormicaryPublicURL: ""
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  NeedsHumanLabel: "needs-human"
  GitHubOrg: ""
  GitHubRepo: ""
  JiraUrl: ""
  JiraProject: ""
  BitbucketWorkspace: ""
  BitbucketRepo: ""
  BitbucketUsername: ""
  AiDevToolsDebug: ""
  YgsSkillsRepo: "https://github.com/bhatti/you-got-skills.git"
