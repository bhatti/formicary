# AI-driven Jira/Bitbucket PR review: review → post findings to Slack → done
#
# All tasks run as Kubernetes pods using the ai-dev-tools image.
# host_network: true enables Tailscale VPN access to the Bedrock proxy.
#
# The review task runs Claude via the ygs-review-pr skill.
# The post task posts the findings summary as plain text to the Slack thread.
#
# Deploy:
#   ./deploy-ai-jira-workflows.sh --create-k8s-secret --set-configs \
#     --bb-workspace YOUR_WORKSPACE --bb-repo YOUR_REPO

job_type: ai-jira-review
description: "AI Bitbucket PR review: analyze PR and post findings to Slack"
max_concurrency: 10
timeout: 3600s

variables:
  PRUrl:
    type: STRING
    required: true

tasks:
# --- REVIEW ------------------------------------------------------------------
- task_type: review
  method: KUBERNETES
  timeout: 20m
  task_variables:
    SELECTED_MODEL: "{{.AnthropicSonnetModel}}"
    SKILL_NAME: "{{.Skill}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    PR_URL: "{{.PRUrl}}"
  context_variables:
    - name: PR_URL
      value: "{{.PRUrl}}"
    - name: SKILL
      value: "{{.Skill}}"
    - name: SELECTED_TRACKER
      value: jira
    - name: SELECTED_MODEL
      value: "{{.AnthropicSonnetModel}}"
    - name: REVIEW_DEPTH
      value: "{{.ReviewDepth}}"
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 6G
    memory_request: 1G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    JIRA_BASE_URL: "{{.JiraUrl}}"
    JIRA_PROJECT: "{{.JiraProject}}"
    BITBUCKET_WORKSPACE: "{{.BitbucketWorkspace}}"
    BITBUCKET_REPO: "{{.BitbucketRepo}}"
    MAX_TURNS_REVIEW: "{{.MaxTurnsReview}}"
    MAX_CLAUDE_PROCESS_TIMEOUT: "{{.MaxClaudeProcessTimeout}}"
    EXTRA_SKILLS_REPOS: "{{.ExtraSkillsRepos}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
    CODEBASE_DIR: /workspace/repo
  script:
    - |
      SKILL="{{.Skill}}"
      if [ "{{.ReviewDepth}}" = "deep" ]; then SKILL="ygs-review-deep"; fi
      python -m scripts.review.run --pr-url "{{.PRUrl}}" --skill "$SKILL"
  artifacts:
    paths:
      - ./reports
      - ./logs
    expire_after: 48h
  on_completed: post
  on_failed: notify-error

# --- POST --------------------------------------------------------------------
# Post findings summary as plain text to the originating Slack thread.
- task_type: post
  method: KUBERNETES
  timeout: 5m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - review
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
  script:
    - python -m scripts.review.post_findings --findings reports/findings.json
  artifacts:
    paths:
      - ./reports
    expire_after: 168h
  on_completed: done

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  context_variables:
    - name: PR_URL
      value: "{{.PRUrl}}"
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
    - name: SELECTED_TRACKER
      value: jira
    - name: ERROR_REASON
      value: "{{.ERROR_REASON}}"
  environment:
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    SKILL_NAME: "review"
    MESSAGE: ":x: Jira review failed for <{{.PRUrl}}|PR>. {{.ERROR_REASON}}"
  script:
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "Review pipeline complete"

job_variables:
  MaxTurnsReview: "50"
  MaxClaudeProcessTimeout: ""
  ExtraSkillsRepos: ""
  Skill: "ygs-review-pr"
  ReviewDepth: "standard"   # set to "deep" for 7-domain review (perf + testing + arch)
  SlackChannel: ""
  SlackThreadTs: ""
  FormicaryPublicURL: ""
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  AnthropicSonnetModel: "us.anthropic.claude-sonnet-4-6"
  AnthropicOpusModel: "us.anthropic.claude-opus-4-6-v1"
  AnthropicHaikuModel: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Injected via org configs (set via deploy-ai-jira-workflows.sh --set-configs):
  #   JiraUrl, JiraProject, BitbucketWorkspace, BitbucketRepo  (plain)
  #   SlackChannel             (plain, optional)
  # Injected from the 'ai-dev-credentials' K8s secret:
  #   JIRA_EMAIL, JIRA_API_TOKEN, BITBUCKET_USERNAME, BITBUCKET_TOKEN
  #   ANTHROPIC_API_KEY        (optional — Bedrock used by default)
  # Injected via org config (encrypted — set by deploy-ai-jira-workflows.sh):
  #   SLACK_BOT_TOKEN          (from SlackToken org config)
  # Set by the Formicary queen's Slack integration on submit:
  #   SlackThreadTs
