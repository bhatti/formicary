# SPDX-License-Identifier: AGPL-3.0-or-later
#
# AI-driven merge queue: read-only risk analysis for open PRs.
#
# Pipeline: collect → group → analyze → report → done
#
# 1. collect:  Gathers all open PRs from the configured repo (no label required).
#              Optional --label filter for GitHub; --repo overrides GH_ORG/GH_REPO.
# 2. group:    Groups PRs by scope (disjoint file sets) into lanes.
# 3. analyze:  Claude with ygs-merge-queue skill: per-lane risk, blast-radius,
#              conflict detection, human-review flags.
# 4. report:   Posts Slack summary with per-lane risk table.
#
# READ-ONLY: no merges, no label writes, no PR mutations of any kind.
#
# Deploy:
#   ./deploy-ai-workflows.sh --create-k8s-secret --set-configs

job_type: ai-merge-queue
description: "Scope-aware merge queue analysis: group open PRs by scope, assess blast-radius and risk per lane"
cron_trigger: "0 2 * * *"
max_concurrency: 1
timeout: 3600s

tasks:
# --- COLLECT -----------------------------------------------------------------
- task_type: collect
  method: KUBERNETES
  timeout: 10m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 2G
    memory_request: 512Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    DEFAULT_TRACKER: "{{.DefaultTracker}}"
    BITBUCKET_WORKSPACE: "{{.BitbucketWorkspace}}"
    BITBUCKET_REPO: "{{.BitbucketRepo}}"
    REPO_URL: "{{.RepoUrl}}"
    READY_LABEL: "{{.ReadyLabel}}"
    TARGET_BRANCH: "{{.TargetBranch}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
    DIFFSTAT_WORKERS: "{{.DiffstatWorkers}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.mq.collect_ready --repo "$REPO_URL" --label "$READY_LABEL" --target-branch "$TARGET_BRANCH"
  artifacts:
    paths:
      - ./ready_prs.json
      - ./logs
    expire_after: 24h
  on_completed: group
  on_failed: notify-error

# --- GROUP -------------------------------------------------------------------
- task_type: group
  method: KUBERNETES
  timeout: 5m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 2G
    memory_request: 512Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - collect
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    MAX_LANES: "{{.MaxLanes}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.mq.group_by_scope
  artifacts:
    paths:
      - ./lane_groups.json
      - ./logs
    expire_after: 24h
  on_completed: analyze
  on_failed: notify-error

# --- ANALYZE -----------------------------------------------------------------
# Claude reads lane_groups.json + ready_prs.json via ygs-merge-queue skill.
# Writes queue_summary.json with per-lane risk analysis.
- task_type: analyze
  method: KUBERNETES
  timeout: 10m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 2G
    memory_request: 512Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - collect
    - group
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    DEFAULT_TRACKER: "{{.DefaultTracker}}"
    REPORT_TITLE: "Merge Queue Analysis"
    TASK_TYPE: analyze
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.mq.analyze --skill ygs-merge-queue
  artifacts:
    paths:
      - ./queue_summary.json
      - ./logs
    expire_after: 24h
  on_completed: report
  on_failed: report

# --- REPORT ------------------------------------------------------------------
- task_type: report
  method: KUBERNETES
  timeout: 5m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "200m"
    memory_limit: 1G
    memory_request: 256Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - collect
    - group
    - analyze
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_ID: "{{.JobID}}"
    DEFAULT_TRACKER: "{{.DefaultTracker}}"
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    REPORT_TITLE: "Merge Queue Analysis"
    TASK_TYPE: report
    DEPLOYMENT_PROFILE: "{{.DeploymentProfile}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - mkdir -p /workspace/reports
    - python -m scripts.mq.report
  artifacts:
    paths:
      - ./reports
    expire_after: 24h
  on_completed: done
  on_failed: notify-error

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    JOB_TYPE: "ai-merge-queue"
    MESSAGE: ":x: Merge queue analysis failed."
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "Merge queue analysis complete"

job_variables:
  RepoUrl: ""
  ReadyLabel: ""
  TargetBranch: ""
  BaseBranch: "main"
  MaxLanes: "4"
  DefaultTracker: ""
  GitHubOrg: ""
  GitHubRepo: ""
  BitbucketWorkspace: ""
  BitbucketRepo: ""
  DeploymentProfile: ""
  DiffstatWorkers: "8"
  AiDevToolsDebug: ""
  FormicaryPublicURL: ""
  SlackChannel: ""
  SlackThreadTs: ""
  SlackToken: ""
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  AnthropicSonnetModel: "us.anthropic.claude-sonnet-4-6"
  AnthropicOpusModel: "us.anthropic.claude-opus-4-6-v1"
  AnthropicHaikuModel: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
