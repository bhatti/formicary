# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Merge queue lane — read-only per-lane risk analysis.
#
# Forked by ai-merge-queue via fan_out.fork_job_type (optional deep-dive mode).
# Each lane receives a set of PRs that touch the same scope.
#
# Pipeline: analyze-lane → report → done
#
# 1. analyze-lane: Fetches risk score for each PR in the lane, computes
#                  conflict risk (overlapping file paths), and writes lane_result.json.
# 2. report:       Posts per-lane Slack summary.
#
# READ-ONLY: no merges, no label writes, no PR mutations.
#
# Deploy:
#   ./deploy-ai-workflows.sh --create-k8s-secret --set-configs

job_type: ai-mq-lane
description: "Single merge queue lane: read-only risk analysis per PR, conflict detection"
max_concurrency: 8
timeout: 1800s

variables:
  LaneData:
    type: STRING
    required: true

tasks:
# --- ANALYZE-LANE ------------------------------------------------------------
- task_type: analyze-lane
  method: KUBERNETES
  timeout: 10m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 2G
    memory_request: 512Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    DEFAULT_TRACKER: "{{.DefaultTracker}}"
    BITBUCKET_WORKSPACE: "{{.BitbucketWorkspace}}"
    BITBUCKET_REPO: "{{.BitbucketRepo}}"
    BASE_BRANCH: "{{.BaseBranch}}"
    LANE_DATA: "{{.LaneData}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - |
      python3 -c "
      import json, os, sys
      from pathlib import Path

      lane = json.loads(os.environ['LANE_DATA'])
      scope_key = lane.get('lane_id', 'default')
      prs = lane.get('prs', [])
      ws = Path('/workspace')
      ws.mkdir(parents=True, exist_ok=True)

      # Collect file paths per PR to detect overlapping changes (conflict risk)
      pr_files: dict = {}
      risk_tiers: dict = {}
      for pr in prs:
          pr_num = pr.get('pr_number') or pr.get('number') or str(pr)
          # Read per-PR risk_score if pre-computed, otherwise use blast_radius from ready_prs
          risk_path = ws / f'risk_score_{pr_num}.json'
          if risk_path.exists():
              rd = json.loads(risk_path.read_text())
              risk_tiers[str(pr_num)] = rd.get('tier', 'MEDIUM')
          else:
              blast = pr.get('blast_radius', 'medium').upper()
              risk_tiers[str(pr_num)] = {'LOW': 'LOW', 'MEDIUM': 'MEDIUM', 'HIGH': 'HIGH'}.get(blast, 'MEDIUM')
          # Collect changed file top-level paths for conflict detection
          files = pr.get('files', [])
          pr_files[str(pr_num)] = {f.get('path', '').split('/')[0] for f in files if f.get('path')}

      # Conflict risk: any two PRs in the lane share top-level paths
      all_pr_ids = list(pr_files.keys())
      conflict_pairs = []
      for i in range(len(all_pr_ids)):
          for j in range(i + 1, len(all_pr_ids)):
              shared = pr_files[all_pr_ids[i]] & pr_files[all_pr_ids[j]]
              if shared:
                  conflict_pairs.append({'pr_a': all_pr_ids[i], 'pr_b': all_pr_ids[j], 'shared_paths': list(shared)})

      highest_risk = 'LOW'
      for t in risk_tiers.values():
          if t == 'HIGH':
              highest_risk = 'HIGH'
              break
          if t == 'MEDIUM':
              highest_risk = 'MEDIUM'

      needs_human_review = [pr_num for pr_num, tier in risk_tiers.items() if tier == 'HIGH']

      lane_result = {
          'scope_key': scope_key,
          'prs': prs,
          'pr_count': len(prs),
          'risk_tiers': risk_tiers,
          'highest_risk': highest_risk,
          'conflict_risk': 'HIGH' if conflict_pairs else 'NONE',
          'conflict_pairs': conflict_pairs,
          'needs_human_review': needs_human_review,
          'status': 'analyzed',
      }
      # Sanitize scope_key for filename: replace '/' with '__' so
      # 'org/branches/FOO/unknown' becomes 'org__branches__FOO__unknown'
      safe_key = scope_key.replace('/', '__')
      out = ws / f'lane_{safe_key}_result.json'
      out.write_text(json.dumps(lane_result, indent=2))
      print(f'[analyze-lane] scope={scope_key} prs={len(prs)} highest_risk={highest_risk} conflicts={len(conflict_pairs)}', flush=True)
      print(f'::add-task-context LANE_SCOPE::{scope_key}', flush=True)
      print(f'::add-task-context LANE_HIGHEST_RISK::{highest_risk}', flush=True)
      conflict_label = 'HIGH' if conflict_pairs else 'NONE'
      print(f'::add-task-context LANE_CONFLICT_RISK::{conflict_label}', flush=True)
      "
  artifacts:
    paths:
      - ./lane_*_result.json
      - ./logs
    expire_after: 24h
  on_completed: report
  on_failed: notify-error

# --- REPORT ------------------------------------------------------------------
- task_type: report
  method: KUBERNETES
  timeout: 3m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "200m"
    memory_limit: 1G
    memory_request: 256Mi
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - analyze-lane
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_ID: "{{.JobID}}"
    DEFAULT_TRACKER: "{{.DefaultTracker}}"
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    REPORT_TITLE: "Merge Queue Lane"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.mq.report
  artifacts:
    paths:
      - ./reports
    expire_after: 24h
  on_completed: done
  on_failed: done

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    JOB_TYPE: "ai-mq-lane"
    MESSAGE: ":x: Merge queue lane analysis failed."
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "Merge queue lane analysis complete"

job_variables:
  BaseBranch: "main"
  GitHubOrg: ""
  GitHubRepo: ""
  DefaultTracker: ""
  BitbucketWorkspace: ""
  BitbucketRepo: ""
  SlackToken: ""
  SlackChannel: ""
  SlackThreadTs: ""
  FormicaryPublicURL: ""
  JobID: ""
  AiDevToolsDebug: ""
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  AnthropicSonnetModel: "us.anthropic.claude-sonnet-4-6"
