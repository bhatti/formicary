# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Read-only AI pr-risk: analyse a PR and report risk/findings — no PR changes.
#
# Pipeline: review → done
#
# review: Clone PR, run the AI review (ygs-pr-risk skill), compute the risk score, compute the gate decision
#         (gate_result.json: needs_approval, risk_tier, critical findings; read-only, no comments or merges) and
#         generate the HTML/MD report: one PR metrics table, findings, risk score and the gate decision.
#
# The report tells the human: "safe to merge" or "needs approval — here's why."
# All actual PR approval/merge actions stay in the normal GitHub/Bitbucket review process.
#
# Deploy:
#   ./deploy-ai-workflows.sh --create-k8s-secret --set-configs

job_type: ai-pr-risk
description: "Read-only AI review: risk score, blast radius, findings — no PR changes"
max_concurrency: 10
timeout: 3600s

variables:
  PRNumber:
    type: STRING
    required: true

tasks:
# --- REVIEW ------------------------------------------------------------------
# Clones the PR, runs AI review, computes risk score, generates full report.
- task_type: review
  method: KUBERNETES
  timeout: 15m
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 4G
    memory_request: 1G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    GH_ORG: "{{.GitHubOrg}}"
    GH_REPO: "{{.GitHubRepo}}"
    PR_NUMBER: "{{.PRNumber}}"
    BASE_BRANCH: "{{.BaseBranch}}"
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    DEFAULT_TRACKER: "{{.DefaultTracker}}"
    BITBUCKET_WORKSPACE: "{{.BitbucketWorkspace}}"
    BITBUCKET_REPO: "{{.BitbucketRepo}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    CODEBASE_DIR: /workspace/repo
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_ID: "{{.JobID}}"
    TASK_TYPE: "review"
    REPORT_TITLE: "PR Risk"
    APPROVAL_THRESHOLD: "{{.ApprovalThreshold}}"
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.mq.clone_pr --pr-number {{.PRNumber}}
    - python -m scripts.mq.scope_router --pr-number {{.PRNumber}} || true
    - python -m scripts.review.run --pr-url {{.PRNumber}} --base-branch {{.BaseBranch}} --skill ygs-pr-risk
    - python -m scripts.mq.risk_score --pr-number {{.PRNumber}}
    # The gate decision must exist before the report is built: the report shows it, and a later pod would not see the report's inputs.
    - python -m scripts.mq.gate_check
    - python -m scripts.mq.report
  artifacts:
    paths:
      - ./review_result.json
      - ./risk_score.json
      - ./gate_result.json
      - ./logs
      - ./reports
    expire_after: 24h
  on_completed: done
  on_failed: notify-error

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    JOB_TYPE: "ai-pr-risk"
    MESSAGE: ":x: PR risk review failed for PR {{.PRNumber}}."
    AI_DEV_TOOLS_DEBUG: "{{.AiDevToolsDebug}}"
  script:
    - python -c "from scripts.common.bootstrap import ensure_debug_mode; ensure_debug_mode()" 2>/dev/null || true
    - touch /tmp/.adt_bootstrap_done
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "PR risk review complete — check report in artifacts"

job_variables:
  BaseBranch: "main"
  ApprovalThreshold: "70"
  AiDevToolsDebug: ""
  FormicaryPublicURL: ""
  SlackChannel: ""
  SlackThreadTs: ""
  DefaultTracker: ""
  BitbucketWorkspace: ""
  BitbucketRepo: ""
  GitHubOrg: ""
  GitHubRepo: ""
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
