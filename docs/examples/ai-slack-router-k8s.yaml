# Kubernetes Deployment for the Slack agent router.
#
# The router is a long-running Bolt (Socket Mode) process that:
#   - Listens on a Slack channel for mentions/messages
#   - Routes requests to formicary jobs (ai-adhoc, ai-gh-review, ai-jira-review,
#     ai-gh-implement, ai-jira-implement)
#   - Resumes PAUSED jobs when users reply to threads or click Block Kit buttons
#
# Apply with:
#   kubectl apply -f ai-slack-router-k8s.yaml
#
# Or use the deploy script:
#   ./deploy-ai-slack-router.sh --create-k8s-secret --set-configs \
#     --slack-channel my-channel
#
# The 'ai-slack-router-credentials' secret must exist before applying.
# Create it via deploy-ai-slack-router.sh --create-k8s-secret.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-slack-router
  namespace: default
  labels:
    app: ai-slack-router
    component: ai-dev-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-slack-router
  strategy:
    type: Recreate    # Socket Mode — only one connection per app token
  template:
    metadata:
      labels:
        app: ai-slack-router
        component: ai-dev-tools
    spec:
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: router
          image: plexobject/ai-dev-tools:latest
          imagePullPolicy: Always
          command: ["python", "-m", "scripts.slack.router"]
          envFrom:
            - secretRef:
                name: ai-slack-router-credentials
          env:
            # Non-secret overrides (can be set via ConfigMap or inline)
            - name: FORMICARY_URL
              value: "http://formicary:7777"
            # Default ticket system when no URL/key is present in the message.
            # "jira" → route standup/implement to Jira workflows by default.
            # "github" → route to GitHub workflows by default.
            - name: DEFAULT_TRACKER
              value: "jira"
            # Public URL used for clickable job links posted to Slack.
            # Set to your port-forward address or external ingress URL.
            # If unset, no link is included in the "Started" message.
            - name: FORMICARY_PUBLIC_URL
              value: ""
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import scripts.slack.registry; scripts.slack.registry.Registry.from_default()"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
      # host_network is NOT needed here — the router only talks to Slack's API
      # (outbound HTTPS) and formicary (internal cluster DNS).
      hostNetwork: false
