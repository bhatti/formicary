# AI standup brief — GitHub + Slack
#
# Same three-task structure as ai-standup-jira.yaml but uses the gh CLI
# to pull open issues and PRs instead of Jira/Bitbucket REST APIs.
#
# Credentials are injected from the 'ai-dev-credentials' Kubernetes secret
# (created once by deploy-ai-standup-gh.sh --create-k8s-secret).
# Non-secret config is set via org configs (deploy-ai-standup-gh.sh --set-configs).
#
# Required org configs (set via deploy-ai-standup-gh.sh --set-configs):
#   GHOrg, GHRepo, SlackChannel
# Optional org configs:
#   StandupTeamMembers (comma-separated GitHub logins), StandupLookbackHours
#
# Deploy (with Formicary running in Kubernetes via k8s.yaml):
#   ./deploy-ai-standup-gh.sh --create-k8s-secret --set-configs \
#     --gh-org myorg --gh-repo myrepo --slack-channel standup
#
job_type: ai-standup-gh
description: "Daily standup brief from GitHub issues/PRs + Slack signals"
cron_trigger: "0 0 16 * * 1-5 *"
max_concurrency: 1
timeout: 900s

job_variables:
  SlackThreadTs: ""
  SlackChannel: ""
  StandupTeamMembers: ""
  StandupLookbackHours: "26"
  StandupStaleDays: "2"
  MaxTurnsStandup: "30"
  ClaudeUseBedrock: "1"
  AnthropicBedrockBaseUrl: "http://ai/bedrock"
  ClaudeSkipBedrockAuth: "1"
  AnthropicSonnetModel: "us.anthropic.claude-sonnet-4-6"
  AnthropicOpusModel: "us.anthropic.claude-opus-4-6-v1"
  AnthropicHaikuModel: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Optional: set FormicaryPublicURL to your Formicary UI base URL (e.g. https://formicary.example.com)
  # so the Slack message includes a direct link to the job's artifacts (HTML report).
  FormicaryPublicURL: ""
  # Optional: comma-separated list of extra skill repo URLs to clone before synthesize.
  ExtraSkillsRepos: ""

tasks:

# --- GATHER ------------------------------------------------------------------
- task_type: gather
  method: KUBERNETES
  timeout: 3m
  task_variables:
    GH_ORG: "{{.GHOrg}}"
    GH_REPO: "{{.GHRepo}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
  context_variables:
    - name: SELECTED_TRACKER
      value: github
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
    - name: GH_ORG
      value: "{{.GHOrg}}"
    - name: STANDUP_TEAM
      value: "{{.StandupTeamMembers}}"
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "200m"
    memory_limit: 2G
    memory_request: 512M
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    GH_ORG: "{{.GHOrg}}"
    GH_REPO: "{{.GHRepo}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    STANDUP_TEAM_MEMBERS: "{{.StandupTeamMembers}}"
    STANDUP_LOOKBACK_HOURS: "{{.StandupLookbackHours}}"
    STANDUP_STALE_DAYS: "{{.StandupStaleDays}}"
  script:
    - python -m scripts.standup.gather_gh
  artifacts:
    paths:
      - ./signals.json
      - ./gather_result.json
    expire_after: 24h
  on_completed: synthesize

# --- SYNTHESIZE --------------------------------------------------------------
- task_type: synthesize
  method: KUBERNETES
  timeout: 15m
  task_variables:
    SELECTED_MODEL: "{{.AnthropicSonnetModel}}"
    MAX_TURNS: "{{.MaxTurnsStandup}}"
  context_variables:
    - name: SELECTED_MODEL
      value: "{{.AnthropicSonnetModel}}"
    - name: MAX_TURNS
      value: "{{.MaxTurnsStandup}}"
    - name: SELECTED_TRACKER
      value: github
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    cpu_request: "500m"
    memory_limit: 6G
    memory_request: 1G
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - gather
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    EXTRA_SKILLS_REPOS: "{{.ExtraSkillsRepos}}"
    MAX_TURNS_STANDUP: "{{.MaxTurnsStandup}}"
    CLAUDE_CODE_USE_BEDROCK: "{{.ClaudeUseBedrock}}"
    ANTHROPIC_BEDROCK_BASE_URL: "{{.AnthropicBedrockBaseUrl}}"
    CLAUDE_CODE_SKIP_BEDROCK_AUTH: "{{.ClaudeSkipBedrockAuth}}"
    AI_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.AnthropicSonnetModel}}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.AnthropicOpusModel}}"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.AnthropicHaikuModel}}"
  script:
    - python -m scripts.standup.synthesize
  artifacts:
    paths:
      - ./signals.json
      - ./standup_brief.md
      - ./synthesize_result.json
      - ./reports
      - ./logs
    expire_after: 72h
  on_completed: post
  on_failed: notify-error

# --- POST --------------------------------------------------------------------
- task_type: post
  method: KUBERNETES
  timeout: 10m
  task_variables:
    SLACK_CHANNEL: "{{.SlackChannel}}"
  context_variables:
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
    - name: SELECTED_TRACKER
      value: github
    - name: JOB_ID
      value: "{{.JobID}}"
  report_stdout: true
  host_network: true
  working_dir: /workspace
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    volumes:
      empty_dir:
        - name: workspace
          mount_path: /workspace
    env_from:
      - secret_ref: ai-dev-credentials
  dependencies:
    - gather
    - synthesize
  environment:
    WORKSPACE_DIR: /workspace
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    FORMICARY_PUBLIC_URL: "{{.FormicaryPublicURL}}"
    JOB_TYPE: "ai-standup-gh"
    JOB_ID: "{{.JobID}}"
  script:
    - python -m scripts.standup.render_html
    - python -m scripts.standup.post
  artifacts:
    paths:
      - ./reports
    when: always
    expire_after: 168h
  on_completed: done
  on_failed: notify-error

# --- NOTIFY-ERROR ------------------------------------------------------------
- task_type: notify-error
  method: KUBERNETES
  report_stdout: true
  always_run: true
  host_network: true
  timeout: 5m
  container:
    image: plexobject/ai-dev-tools:latest
    image_pull_policy: Always
    env_from:
      - secret_ref: ai-dev-credentials
  context_variables:
    - name: SLACK_CHANNEL
      value: "{{.SlackChannel}}"
    - name: SELECTED_TRACKER
      value: github
  environment:
    SLACK_BOT_TOKEN: "{{.SlackToken}}"
    SLACK_CHANNEL: "{{.SlackChannel}}"
    SLACK_THREAD_TS: "{{.SlackThreadTs}}"
    MESSAGE: ":x: Standup job failed. Check <{{.FormicaryPublicURL}}/dashboard/jobs/requests/{{.JobID}}|job logs> for details."
  script:
    - python -m scripts.standup.slack_client
  on_completed: done

# --- DONE --------------------------------------------------------------------
- task_type: done
  method: SHELL
  report_stdout: true
  script:
    - echo "Standup brief complete"
