{{ template "layouts/header" . }}
<div class="page-header mb-4">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">New Banner</h2>
    </div>
    <div class="col-auto">
      <a href="/dashboard/banners" class="btn btn-secondary btn-sm">
        <i class="ti ti-arrow-left me-1"></i>Back
      </a>
    </div>
  </div>
</div>

{{ with .Error }}
<div class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
  {{.}}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{{ end }}

<div class="card">
  <div class="card-body">
    <form action="/dashboard/banners" method="POST">
      {{ template "banners/_form" .Banner }}
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Create Banner</button>
        <a href="/dashboard/banners" class="btn btn-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{ template "layouts/footer" }}
