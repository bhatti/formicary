    </div><!-- /container-xl -->
  </div><!-- /page-wrapper -->
</div><!-- /wrapper -->

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="/js/ansi_colors.js"></script>
<script src="/js/approval.js"></script>
<script>
function load_logs(btn, logs, url) {
  document.getElementById(btn).hidden = true;
  var logsRef = document.getElementById(logs);
  logsRef.hidden = true;
  fetch(url).then(function(r){ return r.text(); }).then(function(data) {
    // Render ANSI escape codes if ansispan is available, otherwise fall back to plain text
    if (typeof ansispan === 'function') {
      const escHtml = function(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      };
      logsRef.innerHTML = ansispan(escHtml(data));
    } else {
      logsRef.textContent = data;
    }
    logsRef.hidden = false;
    logsRef.focus();
  });
}
</script>
